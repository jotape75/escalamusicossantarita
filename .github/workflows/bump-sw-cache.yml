name: Bump SW Cache Version

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.js'
      - '**.css'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump cache version
        run: |
          sed -i "s/const CACHE = \"escala-sr-v[0-9]\+\"/const CACHE = \"escala-sr-v$(date +%Y%m%d%H%M%S)\"/" sw.js

      - name: Commit updated sw.js
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add sw.js
          git commit -m "chore: bump SW cache version [skip ci]" || echo "No changes"
          git push
